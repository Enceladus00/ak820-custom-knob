[package]
name = "knob-win"
description = "Windows platform layer: keyboard hook, Raw Input, input injection, audio sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
knob-core = { path = "../knob-core" }
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
knob-rgb = { path = "../knob-rgb" }
log = "0.4.35"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]
