[package]
name = "knob-probe"
description = "Diagnostic tool: logs everything the AK820 knob sends (keyboard hook, Raw Input, raw HID reports)"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Console", "Win32_Graphics_Gdi"] }
