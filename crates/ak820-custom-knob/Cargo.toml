[package]
name = "ak820-custom-knob"
description = "Background program that gives the AJAZZ AK820 MAX knob custom, per-app functions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
knob-core = { path = "../knob-core" }
knob-win = { path = "../knob-win" }
log = { version = "0.4.35", features = ["std"] }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
