# ak820-custom-knob configuration
#
# Saved changes are picked up automatically. If the file has an error, the
# last working configuration stays active.
#
# Gestures:   rotate, click, double_click, long_press
# Layers:     ctrl, shift, alt, win  (used while that modifier is held;
#             a gesture missing from a layer falls back to the mode itself)
# Actions:    volume, app_volume, mute, scroll, zoom, keys, mouse_click,
#             cycle_mode, passthrough (stock knob behaviour), none
#
# Double-click makes every single click wait ~250 ms to see whether a second
# one follows, but only in modes that bind double_click.

version = 1

[ui]
# "system" follows the Windows light / dark setting; or "light" / "dark".
theme = "system"
# "auto" follows the Windows display language; or a code such as "en".
# Languages without a translation yet fall back to English.
language = "auto"

[timing]
long_press_ms = 500
double_click_ms = 250

# ---------------------------------------------------------------- modes

[[mode]]
id = "volume"
name = "Volume"
icon = "volume"
rotate = { action = "volume", step = 2 }
click = { action = "mute" }
long_press = { action = "cycle_mode" }
ctrl = { rotate = { action = "app_volume", step = 5 } }

[[mode]]
id = "scroll"
name = "Scroll"
icon = "scroll"
rotate = { action = "scroll", lines = 1 }
click = { action = "mouse_click", button = "middle" }
long_press = { action = "cycle_mode" }
shift = { rotate = { action = "scroll", lines = 1, horizontal = true } }
ctrl = { rotate = { action = "zoom" } }

[[mode]]
id = "media"
name = "Media"
icon = "music"
# Arrow keys seek in most video and music players.
rotate = { action = "keys", cw = "Right", ccw = "Left" }
click = { action = "keys", keys = "MediaPlayPause" }
long_press = { action = "cycle_mode" }
ctrl = { rotate = { action = "keys", cw = "MediaNext", ccw = "MediaPrev" } }
shift = { rotate = { action = "volume", step = 2 } }

# ---------------------------------------------------------------- profiles
# The first profile whose `match` fits the foreground app wins.
# `modes` are cycled by long press.

[[profile]]
name = "Default"
match = { exe = "*" }
modes = ["volume", "scroll", "media"]

# ---------------------------------------------------------------- lighting
# Layouts you can apply from the Lighting page in Settings. A layout reaches
# the keyboard only when you click Apply.
#
# effect:     1 Static, 2 Light up on press, 3 Go dark on press, 4 Drifting,
#             5 Snowfall, 6 Blossoms, 7 Breathing, 8 Spectrum cycle, 9 Fountain,
#             10 Colour crossing, 11 Wave, 12 Winding path, 13 Burst on press,
#             14 Double strike, 15 Ripple, 16 Stream, 17 Layered peaks,
#             18 Slanting rain, 19 Shuttle
# colorful:   true cycles through colours instead of using `color`
# brightness, speed: 1 to 5

[[lighting]]
name = "Light Blue"
effect = 1
color = "#66CCFF"
brightness = 3
speed = 3

[[lighting]]
name = "Warm White"
effect = 1
color = "#FFD9A0"
brightness = 3
speed = 3

[[lighting]]
name = "Red Breathing"
effect = 7
color = "#FF2020"
brightness = 4
speed = 2

[[lighting]]
name = "Ocean Wave"
effect = 11
color = "#0080FF"
brightness = 4
speed = 3

[[lighting]]
name = "Rainbow Wave"
effect = 11
color = "#FFFFFF"
colorful = true
brightness = 5
speed = 3

[[lighting]]
name = "Spectrum Cycle"
effect = 8
color = "#FFFFFF"
colorful = true
brightness = 5
speed = 3

[[lighting]]
name = "Ripple"
effect = 15
color = "#FFFFFF"
colorful = true
brightness = 4
speed = 3
