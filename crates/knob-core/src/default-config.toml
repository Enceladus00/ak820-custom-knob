# ak820-custom-knob configuration
#
# Saved changes are picked up automatically. If the file has an error, the
# last working configuration stays active.
#
# Gestures:   rotate, click, double_click, long_press
# Layers:     ctrl, shift, alt, win  (used while that modifier is held;
#             a gesture missing from a layer falls back to the mode itself)
# Actions:    volume, app_volume, mute, mic_volume, mic_mute, audio_output,
#             open (target = "app.exe", a file, a folder or a web address;
#             optional args = "..."), scroll, zoom, keys, mouse_click,
#             run_macro, toggle_mouse_mode, click_hints, cycle_mode,
#             passthrough (stock knob behaviour), none
#
# Double-click makes every single click wait ~250 ms to see whether a second
# one follows, but only in modes that bind double_click.

version = 1

[ui]
# "system" follows the Windows light / dark setting; or "light" / "dark".
theme = "system"
# "auto" follows the Windows display language; or a code such as "en".
# Languages without a translation yet fall back to English.
language = "auto"

[timing]
long_press_ms = 500
double_click_ms = 250

# ---------------------------------------------------------------- modes

[[mode]]
id = "volume"
name = "Volume"
icon = "volume"
rotate = { action = "volume", step = 2 }
click = { action = "mute" }
long_press = { action = "cycle_mode" }
ctrl = { rotate = { action = "app_volume", step = 5 } }

[[mode]]
id = "scroll"
name = "Scroll"
icon = "scroll"
rotate = { action = "scroll", lines = 1 }
click = { action = "mouse_click", button = "middle" }
long_press = { action = "cycle_mode" }
shift = { rotate = { action = "scroll", lines = 1, horizontal = true } }
ctrl = { rotate = { action = "zoom" } }

[[mode]]
id = "media"
name = "Media"
icon = "music"
# Arrow keys seek in most video and music players.
rotate = { action = "keys", cw = "Right", ccw = "Left" }
click = { action = "keys", keys = "MediaPlayPause" }
long_press = { action = "cycle_mode" }
ctrl = { rotate = { action = "keys", cw = "MediaNext", ccw = "MediaPrev" } }
shift = { rotate = { action = "volume", step = 2 } }

# ---------------------------------------------------------------- profiles
# The first profile whose `match` fits the foreground app wins.
# `modes` are cycled by long press.

[[profile]]
name = "Default"
match = { exe = "*" }
modes = ["volume", "scroll", "media"]

# ---------------------------------------------------------------- lighting
# Layouts you can apply from the Lighting page in Settings. A layout reaches
# the keyboard only when you click Apply.
#
# effect:     1 Static, 2 Light up on press, 3 Go dark on press, 4 Drifting,
#             5 Snowfall, 6 Blossoms, 7 Breathing, 8 Spectrum cycle, 9 Fountain,
#             10 Colour crossing, 11 Wave, 12 Winding path, 13 Burst on press,
#             14 Double strike, 15 Ripple, 16 Stream, 17 Layered peaks,
#             18 Slanting rain, 19 Shuttle
# colorful:   true cycles through colours instead of using `color`
# brightness, speed: 1 to 5

[[lighting]]
name = "Light Blue"
effect = 1
color = "#66CCFF"
brightness = 3
speed = 3

[[lighting]]
name = "Warm White"
effect = 1
color = "#FFD9A0"
brightness = 3
speed = 3

[[lighting]]
name = "Red Breathing"
effect = 7
color = "#FF2020"
brightness = 4
speed = 2

[[lighting]]
name = "Ocean Wave"
effect = 11
color = "#0080FF"
brightness = 4
speed = 3

[[lighting]]
name = "Rainbow Wave"
effect = 11
color = "#FFFFFF"
colorful = true
brightness = 5
speed = 3

[[lighting]]
name = "Spectrum Cycle"
effect = 8
color = "#FFFFFF"
colorful = true
brightness = 5
speed = 3

[[lighting]]
name = "Ripple"
effect = 15
color = "#FFFFFF"
colorful = true
brightness = 4
speed = 3

# ---------------------------------------------------------------- effects
# Effects for the patched keyboard firmware, made on the Effects page in
# Settings. They are kept in the keyboard's memory only (never its flash), and
# a game or the knob starts and stops them by slot. See docs/effects-format.md.
#
# slot:        1 to 8, each used once
# pattern:     solid, pulse, wave, flicker, sparkle
# colors:      1 to 4 colours, "#RRGGBB"
# speed:       1 to 10
# brightness:  1 to 100 (percent)
# duration_ms: 0 plays until stopped; otherwise it stops by itself (up to 60000)
# when:        plays by itself while any of these holds; the first matching
#              effect in this list wins. "app:valheim.exe", "mode:Volume", or
#              "game:..." from a game plugin, e.g. "game:effects=burning",
#              "game:health<0.25", "game:event=hurt" (integrations/valheim)

[[effects]]
name = "Fire"
slot = 1
pattern = "flicker"
colors = ["#FF2000", "#FF7000", "#FFC040"]
speed = 6
brightness = 100
duration_ms = 0
when = ["game:effects=burning"]

[[effects]]
name = "Frost"
slot = 2
pattern = "wave"
colors = ["#A0E8FF", "#2060FF", "#FFFFFF"]
speed = 3
brightness = 100
duration_ms = 0
when = ["game:effects=frost", "game:effects=freezing"]

[[effects]]
name = "Poison"
slot = 3
pattern = "pulse"
colors = ["#40FF20", "#003000"]
speed = 5
brightness = 100
duration_ms = 0
when = ["game:effects=poison"]

[[effects]]
name = "Low health"
slot = 4
pattern = "pulse"
colors = ["#FF0000", "#200000"]
speed = 8
brightness = 100
duration_ms = 0
when = ["game:health<0.25"]

[[effects]]
name = "Shock"
slot = 5
pattern = "sparkle"
colors = ["#101030", "#FFFFFF", "#80C0FF"]
speed = 9
brightness = 100
duration_ms = 0
when = ["game:effects=lightning"]

# ---------------------------------------------------------------- key remapping
# Off until you add a rule. Each [[remap]] turns one key or shortcut into
# another key, a character or a shortcut, in every app or only in the apps
# listed. A key turned into another single key is held for as long as you hold
# it; a shortcut is sent once per press. When `from` is a shortcut (Alt+1), its
# modifiers are let go while the new key is sent, so Alt+1 can type ">".
# Remaps never apply while the Settings window is in front.
#
# [[remap]]
# from = "CapsLock"
# to = "Esc"
#
# [[remap]]
# from = "Alt+1"
# to = ">"
#
# [[remap]]
# from = "F13"
# to = "Ctrl+Shift+M"
# apps = ["Teams.exe"]
