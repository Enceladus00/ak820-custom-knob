# Builds the installer and portable zip from the public source code.
#
# * Pushing a tag like v1.2.0 builds the release and attaches both files to a
#   *draft* GitHub release. Review it, write the notes, then publish it.
# * "Run workflow" on the Actions tab builds the same files without a release,
#   to try the build. They appear as an artifact of the run.
#
# Every file also gets a build provenance attestation: anyone can check that it
# was built here, from this repository, with
#   gh attestation verify <file> --repo Enceladus00/ak820-custom-knob
#
# Code signing (SignPath Foundation) is added here once the project is
# accepted; see docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the draft release
  id-token: write # build provenance attestation
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tag matches the version in Cargo.toml
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} doesn't match version $version in Cargo.toml"
          }

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build installer and portable zip
        shell: pwsh
        run: ./tools/build-release.ps1

      - name: Build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/ak820-custom-knob-setup.exe
            dist/ak820-custom-knob-portable.zip

      - name: Keep the files with this run
        uses: actions/upload-artifact@v4
        with:
          name: ak820-custom-knob-${{ github.ref_name }}
          path: |
            dist/ak820-custom-knob-setup.exe
            dist/ak820-custom-knob-portable.zip
          if-no-files-found: error

      - name: Draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            dist/ak820-custom-knob-setup.exe `
            dist/ak820-custom-knob-portable.zip `
            --draft --verify-tag `
            --title "AK820 Custom Knob ${{ github.ref_name }}" `
            --generate-notes
